<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: rgb(244, 246, 249);
            margin: 0;
            padding: 0;
        }

         .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
        }
         h2 {
            color: rgb(51, 51, 51);
            text-align: center;
            margin-bottom: 20px;
        }

         label {
            font-weight: bold;
            color: #444;
        }
         select {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 20px;
            border: 2px solid #4CAF50;
            border-radius: 5px;
            font-size: 16px;
            background: #f9f9f9;
            cursor: pointer;
        }

                select:focus {
            outline: none;
            border-color: #2196F3;
            background: #eef7ff;
        }

         #output {
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e9;
            border-left: 5px solid #4CAF50;
            font-size: 18px;
            color: #2e7d32;
            border-radius: 5px;
        }
        #homepage
    {    
        position: absolute;
        margin-left: 30px;
        padding: 10px 20px; 
        background: #a9abd8;
        border: none;
        border-radius: 20px;
        text-decoration: none;

    }

    </style>
</head>
<body>
    <div class="container">
        <h2>Pull down menu & List Boxes</h2>
        <label >Select a course:</label>
        <select  id="courseMenu">
            <option value="">Choose a course</option>
            <option value="javaScript">JavaScript</option>
            <option value="HTML">HTML</option>
            <option value="CSS">CSS</option>
            <option value="Python">Python</option>
        </select>

        <label>Select Your hobbies</label>
        <select  id="hobbyList" mutiple size="4">
            <option>Reading</option>
            <option>Gaming</option>
            <option>Music</option>
            <option>Travelling</option>
        </select>

        <div id="output">Your output will appear Here...</div>

    </div>
    <a id="homepage" href="https://sachinacharya28.github.io/SEM-4-FET/assignments/one.html">Home Page</a>
</body>

<script>
    const courseMenu=document.getElementById('courseMenu');
    courseMenu.addEventListener("change",function(){
        document.getElementById("output").textContent="Selected Course:"+this.value;
    });

     const hobbyList = document.getElementById("hobbyList");

        hobbyList.addEventListener("change", function () {

            let selectedHobbies = [];

            for (let option of hobbyList.options) {

                if (option.selected) {
                    selectedHobbies.push(option.value);
                }
            }

            document.getElementById("output").innerHTML =
                "Selected Hobbies: " + selectedHobbies.join(", ");
        });

    
</script>
</html>
